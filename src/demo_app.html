<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>When Captions Lie: live demo</title>
<style>
:root{--navy:#101141;--title:#002060;--orange:#FCB017;--dorange:#E39B00;--sky:#76C2E5;--red:#E31C24;--blue:#1F6FB5;
--ink:#1a1a1a;--mut:#666;--line:#e3e6ec;--bg:#f6f7fa;--card:#fff;--tint:#eef5fb;--rt:#fce4e4;--ot:#fff4dc;--ok:#1F6FB5;--bad:#E31C24}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",Calibri,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0 12px 0 0;font-weight:700}
header label{font-size:12px;opacity:.8;margin-right:4px}
header select{font:inherit;font-size:14px;padding:5px 8px;border-radius:6px;border:0;max-width:420px}
.pill{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.15)}
.pill.live{background:#2e9d58}.pill.replay{background:var(--dorange)}.pill.busy{background:var(--red)}
nav{display:flex;gap:6px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:52px;z-index:4}
nav button{flex:1;min-width:120px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 8px;cursor:pointer;font:inherit;font-size:13px;color:var(--mut);text-align:left}
nav button b{display:inline-block;width:22px;height:22px;border-radius:50%;background:#e9ecf2;color:var(--navy);text-align:center;line-height:22px;margin-right:6px;font-size:12px}
nav button.on{border-color:var(--navy);color:var(--navy);font-weight:600;background:var(--tint)}
nav button.on b{background:var(--navy);color:#fff}
nav button.done b{background:var(--sky);color:var(--navy)}
main{padding:16px 20px 90px;max-width:1500px;margin:0 auto}
h2{color:var(--title);margin:4px 0 10px;font-size:22px}
h3{color:var(--navy);margin:0 0 8px;font-size:16px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g64{grid-template-columns:3fr 2fr}.g46{grid-template-columns:2fr 3fr}
@media(max-width:900px){.g2,.g3,.g4,.g64,.g46{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.mut{color:var(--mut);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{background:var(--navy);color:#fff;text-align:left;padding:6px 8px;font-weight:600}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--tint)}tr.sel td{background:#dcebf8}
.ok{color:#178a46;font-weight:700}.bad{color:var(--red);font-weight:700}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.5;cursor:default}
.imgwrap{position:relative;line-height:0;display:inline-block;max-width:100%}.imgwrap img{max-width:100%;max-height:var(--mh,420px);border-radius:8px;border:1px solid var(--line);display:block}
.imgwrap svg{position:absolute;left:0;top:0;width:100%;height:100%}
.ladder div{padding:7px 10px;border-radius:6px;margin-bottom:5px;font-size:14px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#e9ecf2;color:var(--navy);font-weight:600;margin-right:4px}
.bar{height:16px;background:#eef0f4;border-radius:4px;position:relative;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;border-left:2px dashed #999}
.big{font-size:34px;font-weight:800;line-height:1.1}
.kpi .card{text-align:left}
.progress{height:8px;background:#e9ecf2;border-radius:6px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
pre{background:#f4f5f7;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12.5px;margin:0;max-height:240px;overflow:auto}
.math{font-family:"Cambria Math",Cambria,serif;font-size:18px;background:var(--tint);padding:10px 14px;border-radius:8px;margin:6px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-top:4px}.legend span:before{content:"";display:inline-block;width:14px;height:4px;margin-right:5px;vertical-align:middle;background:var(--c)}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:9px 20px;display:flex;justify-content:space-between;align-items:center;z-index:5}
#overlay{position:fixed;inset:0;background:rgba(16,17,65,.55);display:none;align-items:center;justify-content:center;z-index:10;color:#fff;font-size:22px;flex-direction:column;gap:10px}
.spin{width:44px;height:44px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.flow{display:flex;align-items:center;gap:10px}.flow .arrow{font-size:28px;color:var(--mut)}
.badge{padding:10px 12px;border-radius:8px;margin-bottom:8px}
input[type=text]{font:inherit;padding:9px 10px;border:1px solid #ccd;border-radius:8px;width:100%}
</style>
</head>
<body>
<header>
  <h1>When Captions Lie · live pipeline demo</h1>
  <span><label>MODEL</label><select id="model"></select></span>
  <span><label>IMAGE</label><select id="item"></select></span>
  <span class="pill" id="mode"></span><span class="pill" id="status"></span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer><button class="btn alt" id="prev">← Previous</button><span class="mut" id="foot"></span><button class="btn" id="next">Next →</button></footer>
<div id="overlay"><div class="spin"></div><div id="ovtext">Loading…</div></div>
<script>
const STEPS = [["Data", "raw photo → clean item"], ["Prompts", "captions × questions"], ["Run", "query the VLM live"], ["Readout", "logits → probability"], ["Score", "this image's verdict"], ["Dataset", "statistics over all images"], ["Inside", "logistic probe (H5)"]];
const NICE = { none: "no caption", neutral: "neutral", consistent: "TRUE caption", contra_1: "false · hedged", contra_2: "false · plain", contra_3: "false · “definitely”", contra_4: "false · “verified”" };
const CONDS = ["none", "neutral", "consistent", "contra_1", "contra_2", "contra_3", "contra_4"];
const CCOL = { none: "#ffffff", neutral: "#eeeeee", consistent: "#dcebf8", contra_1: "#fbdadb", contra_2: "#f5a9ab", contra_3: "#ec6a6e", contra_4: "#E31C24" };
const QN = { q1: "Q1 marker check", q2: "Q2 action seen?", q2_foil: "Q2 foil (absent action)", q3: "Q3 lie noticed?", q4: "Q4 WHO? (binding)" };
const demo = { step: 0, state: null, item: null, answers: {}, selectedQueryId: null, datasetStats: {}, probe: null, live: null, busy: false };
const $ = id => document.getElementById(id);
const pct = (v, d = 0) => v == null ? "–" : (v * 100).toFixed(d) + "%";
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
async function requestJson(u, body) {
    const r = await fetch(u, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    return r.json();
}
function showOverlay(t) {
    $("overlay").style.display = t ? "flex" : "none";
    if (t)
        $("ovtext").textContent = t;
}
const img = p => "/img?p=" + encodeURIComponent(p);
function lineChart(o) {
    const W = o.w || 640, H = o.h || 280, ml = 46, mr = 14, mt = 12, mb = o.mb || 46, n = o.labels.length, y0 = o.ymin ?? 0, y1 = o.ymax ?? 1;
    const X = i => ml + (n < 2 ? 0 : i * (W - ml - mr) / (n - 1)), Y = v => mt + (1 - (v - y0) / (y1 - y0)) * (H - mt - mb);
    let s = "";
    for (let k = 0; k <= 4; k++) {
        const v = y0 + k * (y1 - y0) / 4;
        s += `<line x1=${ml} x2=${W - mr} y1=${Y(v)} y2=${Y(v)} stroke="#eceef2"/><text x=${ml - 6} y=${Y(v) + 4} font-size=11 text-anchor=end fill="#777">${o.yfmt ? o.yfmt(v) : v}</text>`;
    }
    if (o.hline != null)
        s += `<line x1=${ml} x2=${W - mr} y1=${Y(o.hline)} y2=${Y(o.hline)} stroke="#999" stroke-dasharray="5 4"/><text x=${W - mr} y=${Y(o.hline) - 4} font-size=11 text-anchor=end fill="#888">${o.hlabel || ""}</text>`;
    for (const se of o.series) {
        if (se.lo) {
            let up = "", dn = "";
            se.lo.forEach((v, i) => {
                if (v != null && se.hi[i] != null) {
                    up += `${X(i)},${Y(se.hi[i])} `;
                    dn = `${X(i)},${Y(v)} ` + dn;
                }
            });
            s += `<polygon points="${up}${dn}" fill="${se.color}" opacity=".13"/>`;
        }
        let d = "", pen = false;
        se.y.forEach((v, i) => {
            if (v == null) {
                pen = false;
                return;
            }
            d += (pen ? "L" : "M") + X(i) + "," + Y(v);
            pen = true;
        });
        s += `<path d="${d}" fill=none stroke="${se.color}" stroke-width="${se.width || 2.5}" ${se.dash ? 'stroke-dasharray="6 4"' : ""}/>`;
        if (o.dots !== false)
            se.y.forEach((v, i) => {
                if (v != null)
                    s += `<circle cx=${X(i)} cy=${Y(v)} r=3.5 fill="${se.color}"/>`;
            });
    }
    o.labels.forEach((l, i) => {
        if (o.every && i % o.every)
            return;
        s += o.rot ? `<text transform="translate(${X(i)},${H - mb + 14}) rotate(-22)" font-size=11 text-anchor=end fill="#555">${esc(l)}</text>` : `<text x=${X(i)} y=${H - mb + 16} font-size=11 text-anchor=middle fill="#555">${esc(l)}</text>`;
    });
    if (o.xlab)
        s += `<text x=${(ml + W - mr) / 2} y=${H - 4} font-size=12 text-anchor=middle fill="#444">${o.xlab}</text>`;
    if (o.ylab)
        s += `<text transform="translate(12,${(mt + H - mb) / 2}) rotate(-90)" font-size=12 text-anchor=middle fill="#444">${o.ylab}</text>`;
    const leg = o.series.filter(x => x.name).map(x => `<span style="--c:${x.color}">${esc(x.name)}</span>`).join("");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg><div class=legend>${leg}</div>`;
}
function horizontalBars(rows, o = {}) {
    const W = o.w || 620, rh = o.rh || 30, ml = o.ml || 170, H = rows.length * rh + 8, mx = o.max ?? 1;
    let s = "";
    rows.forEach((r, i) => {
        const y = i * rh + 4, w = Math.max(0, (W - ml - 60) * (o.log ? Math.log10(Math.max(r.v, 1)) / Math.log10(mx) : r.v / mx));
        s += `<text x=${ml - 8} y=${y + rh / 2 + 4} font-size=12.5 text-anchor=end fill="#333">${esc(r.label)}</text><rect x=${ml} y=${y + 4} width=${W - ml - 60} height=${rh - 10} rx=4 fill="#eef0f4"/><rect x=${ml} y=${y + 4} width=${w} height=${rh - 10} rx=4 fill="${r.color || '#101141'}"/><text x=${ml + w + 6} y=${y + rh / 2 + 4} font-size=12.5 font-weight=700 fill="#222">${r.txt ?? pct(r.v)}</text>`;
    });
    if (o.mid)
        s += `<line x1=${ml + (W - ml - 60) / 2} x2=${ml + (W - ml - 60) / 2} y1=0 y2=${H} stroke="#888" stroke-dasharray="5 4"/>`;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function betaCurves(rows) {
    const xs = [...Array(301).keys()].map(i => i / 300);
    return rows.map(r => {
        const lp = xs.map(x => (x <= 0 || x >= 1) ? ((r.alpha == 1 && x == 0) || (r.beta == 1 && x == 1) ? 0 : -Infinity) : (r.alpha - 1) * Math.log(x) + (r.beta - 1) * Math.log(1 - x));
        const m = Math.max(...lp);
        return { ...r, y: lp.map(v => Math.exp(v - m)) };
    });
}
async function boot() {
    showOverlay("Connecting…");
    demo.state = await requestJson("/api/state");
    $("mode").textContent = demo.state.mode === "live" ? "LIVE on GPU" : "REPLAY (recorded run)";
    $("mode").className = "pill " + demo.state.mode;
    $("model").innerHTML = demo.state.models.map(m => `<option ${m === demo.state.model ? "selected" : ""}>${m}</option>`).join("");
    fillItems();
    showOverlay(null);
    $("nav").innerHTML = STEPS.map((s, i) => `<button data-i=${i}><b>${i + 1}</b>${s[0]} <span class=mut>· ${s[1]}</span></button>`).join("");
    $("nav").onclick = e => {
        const b = e.target.closest("button");
        if (b)
            showStep(+b.dataset.i);
    };
    $("prev").onclick = () => showStep(demo.step - 1);
    $("next").onclick = () => showStep(demo.step + 1);
    document.onkeydown = e => {
        if (e.target.tagName === "INPUT")
            return;
        if (e.key === "ArrowRight")
            showStep(demo.step + 1);
        if (e.key === "ArrowLeft")
            showStep(demo.step - 1);
    };
    $("item").onchange = () => loadItem($("item").value);
    $("model").onchange = switchModel;
    await loadItem($("item").value);
    const h = location.hash.match(/s(\d)/);
    if (h)
        showStep(+h[1] - 1);
}
function fillItems(cur) {
    const c = demo.state.curated, ids = new Set(c.map(x => x.id));
    $("item").innerHTML = `<optgroup label="Suggested for ${demo.state.model}">` + c.map(x => `<option value="${x.id}">${x.tag === "fooled" ? "⚠ fooled" : "✓ resists"} · ${esc(x.label)} (${x.id})</option>`).join("") +
        `</optgroup><optgroup label="All 952 items">` + demo.state.all.filter(x => !ids.has(x.id)).map(x => `<option value="${x.id}">${esc(x.label)} (${x.id})</option>`).join("") + "</optgroup>";
    if (cur)
        $("item").value = cur;
}
async function switchModel() {
    const m = $("model").value;
    showOverlay(demo.state.mode === "live" ? `Loading ${m} onto the GPU (30–60 s)…` : `Switching to ${m}…`);
    const r = await requestJson("/api/load", { model: m });
    showOverlay(null);
    if (r.error) {
        alert(r.error);
        return;
    }
    demo.state.model = r.model;
    demo.state.curated = r.curated;
    demo.answers = {};
    demo.datasetStats = {};
    demo.live = null;
    fillItems(demo.item?.id);
    render();
}
async function loadItem(id) {
    demo.item = await requestJson("/api/item?id=" + encodeURIComponent(id));
    demo.answers = {};
    demo.live = null;
    demo.selectedQueryId = defaultQueryId();
    render();
}
function defaultQueryId() {
    const q = demo.item.queries.find(q => q.question === "q4" && q.condition === "contra_2" && q.order === 0);
    return q.qid;
}
function showStep(i) {
    if (i < 0 || i >= STEPS.length)
        return;
    demo.step = i;
    render();
    window.scrollTo(0, 0);
}
function render() {
    document.querySelectorAll("nav button").forEach((b, i) => {
        b.className = i === demo.step ? "on" : (i < demo.step ? "done" : "");
    });
    $("status").textContent = `${demo.state.model}`;
    $("foot").textContent = `Step ${demo.step + 1} of 7 · ${STEPS[demo.step][0]} · ← → keys to move`;
    $("prev").disabled = demo.step === 0;
    $("next").disabled = demo.step === 6;
    [stepData, stepPrompts, stepRun, stepReadout, stepScore, stepDataset, stepInside][demo.step]();
}
const currentItem = () => demo.item, truth = () => `<b>${currentItem().actor}</b> is ${esc(currentItem().action)}`;
function boxesSVG(it, list, w, h) {
    const fs = Math.max(11, w / 30), th = fs * 1.35;
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">` + list.map(b => {
        const [x, y, bw, bh] = b.bbox, act = b.category === "person" && b.actions?.includes(it.verb);
        const c = b.category !== "person" ? "#1F6FB5" : (act ? "#E39B00" : "#E31C24");
        const lab = (b.category === "person" ? (act ? "ACTOR" : "person") : b.category) + (b.actions?.length ? ": " + b.actions.join(", ") : "");
        const ty = y - th >= 0 ? y - th : y;
        return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="none" stroke="${c}" stroke-width="${Math.max(2, w / 200)}"/><rect x="${x}" y="${ty}" width="${Math.min(w - x, lab.length * fs * 0.55 + 8)}" height="${th}" fill="${c}"/><text x="${x + 4}" y="${ty + fs * 1.02}" font-size="${fs}" fill="white" font-weight="600" font-family="Segoe UI">${esc(lab)}</text>`;
    }).join("") + "</svg>";
}
function stepData() {
    const it = currentItem(), f = demo.state.funnel;
    let left, right;
    if (it.dataset === "real") {
        left = `<div class=card><h3>① The raw source photo, with its original labels</h3><div class=imgwrap><img src="${img(it.raw)}">${boxesSVG(it, it.src || [], it.w, it.h)}</div>
      <div class=mut style="margin-top:6px">${esc(it.source_file)} · ${it.source === "vcoco" ? "COCO photo, action labels from V-COCO" : "HICO-DET"} · ${it.w}×${it.h}px · orange = the person labelled with the action, red = other person, blue = object</div></div>`;
        right = `<div class=card><h3>② What the dataset says about each person</h3><table><tr><th>object</th><th>box (x, y, w, h)</th><th>action labels</th></tr>${(it.src || []).map(s => `<tr><td>${esc(s.category)}</td><td class=mut>${s.bbox.map(v => Math.round(v)).join(", ")}</td><td>${s.actions.length ? esc(s.actions.join(", ")) : "<span class=mut>–</span>"}</td></tr>`).join("")}</table>
      <h3 style="margin-top:14px">③ Validity rules this photo passed</h3><table><tr><th>rule</th><th>meaning</th><th>this photo</th><th></th></tr>${it.checks.map(c => `<tr><td><b>${c[0]}</b></td><td>${esc(c[1])}</td><td class=mut>${esc(c[2])}</td><td class=${c[3] ? "ok" : "bad"}>${c[3] ? "✓" : "✗"}</td></tr>`).join("")}</table></div>`;
    }
    else {
        left = `<div class=card><h3>① A synthetic scene (drawn by our generator)</h3><div class=imgwrap><img src="${img(it.plain)}"></div><div class=mut style="margin-top:6px">Procedurally drawn: the actor wears ${esc(it.colors?.[0])}, the other person ${esc(it.colors?.[1])}. Exact ground truth, perfectly balanced across 800 scenes.</div></div>`;
        right = `<div class=card><h3>② Why synthetic scenes?</h3><p>Real photos give <b>realism</b> but only 152 survive our filter (±7.9 pp error bars). 800 drawn scenes (4 actions × 200) give <b>statistical power</b> (±3.5 pp). Same captions, same questions, same scoring.</p></div>`;
    }
    const fr = f.filter(r => !r.stage.startsWith("(V-COCO only)") && !r.stage.startsWith("CVC1 strict") && !r.stage.startsWith("FINAL"));
    $("main").innerHTML = `<h2>Step 1 · Data: from a raw labelled photo to a clean test item</h2>
  <div class="grid g2">${left}${right}</div>
  <div class="grid g2" style="margin-top:14px">
   <div class=card><h3>④ The data-wrangling funnel (all 48,464 photos)</h3>${horizontalBars(fr.map((r, i) => ({ label: r.stage.replace(/\(.*?\)/g, "").slice(0, 40), v: r.total, txt: r.total.toLocaleString(), color: i === fr.length - 1 ? "#E31C24" : "#101141" })), { log: true, max: 60000, ml: 250, rh: 26 })}<div class=mut>log scale · only 0.3% survive · 138 V-COCO + 14 HICO-DET real items, plus 800 synthetic</div></div>
   <div class=card><h3>⑤ What the model will actually see</h3><div class=flow><div style="flex:1"><div class=imgwrap><img src="${img(it.plain)}"></div><div class=mut>plain</div></div><div class=arrow>→</div><div style="flex:1"><div class=imgwrap><img src="${img(it.marked)}"></div><div class=mut>marked: identical yellow boxes A / B</div></div></div>
   <p style="margin:10px 0 0">Ground truth: ${truth()}. Letters are random, so the actor is A in ~50% of items.</p></div></div>`;
}
function stepPrompts() {
    const it = currentItem(), cnt = {};
    it.queries.forEach(q => cnt[q.question] = (cnt[q.question] || 0) + 1);
    $("main").innerHTML = `<h2>Step 2 · Prompts: every caption × question combination for this image</h2>
  <div class="grid g46"><div class=card><h3>The caption ladder (the “dose” of the lie)</h3><div class=ladder>${it.captions.map(c => `<div style="background:${CCOL[c.cond]};${["contra_3", "contra_4"].includes(c.cond) ? "color:#fff" : ""};border:1px solid #e5e5e5"><b>${NICE[c.cond]}</b> &nbsp; <i>${c.text ? "“" + esc(c.text) + "”" : "(image only)"}</i></div>`).join("")}</div></div>
  <div class=card><h3>The four questions</h3><table><tr><th>question</th><th>why we ask it</th><th>n</th></tr>
   <tr><td><b>Q1</b> “Which marker is on the person on the left?”</td><td>sanity: can it read the A/B marks?</td><td>${cnt.q1 || 0}</td></tr>

   <div class=card><h3>Live: probe <i>this</i> image</h3><p class=mut>Trained on the other 351 cached images (no-caption states only), then applied to this image’s hidden states computed right now, with no caption and with the plain lie (order A/B). Needs Qwen in live mode.</p><button class=btn id=pl>▶ Probe this image</button><div id=plout style="margin-top:10px"></div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class=card><h3>Activation patching: where does the lie travel?</h3><svg viewBox="0 0 ${W} 145" width="100%">${hm}</svg><p class=mut>Copy one piece of the true-caption run into the lie run (layer × position) and measure how much of the answer is restored (dark = all of it). Route: the caption’s “B” (layers 0–15) → question tokens (18–24) → final token (27+). Blocking direct attention from the final token to “B” changes nothing.</p></div>
   <div class=card><h3>What it means</h3><ul><li>The model <b>does</b> represent who is acting (90% decodable).</li><li>A confident false caption <b>rewrites</b> that representation, so it is not a last-step output glitch.</li><li>So you cannot fix it by “reading the hidden truth”; the fix must come before the binding, e.g. checking the caption against the image first.</li></ul><p class=mut>Pre-registered rule: supported if the Wilson lower bound on flipped items &gt; 0.5. Observed 0.22 [0.15, 0.31].</p></div></div>`;
    const show = r => {
        if (r.error) {
            $("plout").innerHTML = `<p class=bad>${esc(r.error)}</p>`;
            return;
        }
        const L2 = r.layers, last = L2[L2.length - 1], l25 = L2[p.layer];
        $("plout").innerHTML = lineChart({ h: 240, labels: L2.map(x => x.layer), every: 5, dots: false, hline: .5, series: [{ name: "no caption", color: "#1F6FB5", y: L2.map(x => x.none) }, { name: "“" + r.lie_caption + "”", color: "#E31C24", y: L2.map(x => x.lie) }], yfmt: v => pct(v), ylab: "probe: P(true actor)", xlab: "layer" }) +
            `<p>Model’s own answer, P(true actor): no caption <b>${pct(r.answer_p_true.none)}</b> → with the lie <b class=${r.answer_p_true.lie < .5 ? "bad" : "ok"}>${pct(r.answer_p_true.lie)}</b>.<br>Probe at layer ${p.layer}: no caption <b>${pct(l25.none)}</b> → with the lie <b class=${l25.lie < .5 ? "bad" : "ok"}>${pct(l25.lie)}</b> ${l25.lie < .5 ? "(reads the caption’s person)" : "(still reads the truth)"}.</p>`;
    };
    if (demo.live)
        show(demo.live);
    $("pl").onclick = async () => {
        $("pl").disabled = true;
        $("plout").textContent = "computing hidden states and training 37 probes…";
        const r = await requestJson("/api/probe_live", { item: currentItem().id });
        if (!r.error)
            demo.live = r;
        show(r);
        $("pl").disabled = false;
    };
}
boot();
</script>
</body>
